# Drop-in for ollama.service: /etc/systemd/system/ollama.service.d/gpu-headroom.conf
#
# Reserve 1 GiB of VRAM per GPU that Ollama's placement planner must leave free.
# Not a capacity cut: the 80b reviewer (18.8 + 17.5 GiB weights) and the 27b at
# its full 262144 window both still place entirely on the two 3090s. What it
# removes is the last-GiB allocation at load time. On 2026-10-05 06:15 the 80b
# loaded with 1.4 GiB left on GPU 0 and the guest kernel logged
# create_existing_sysmem ... -12 (a pinned allocation the host refused) within a
# second; under WSL2 that edge is where WDDM pages VRAM to system memory and
# where the upstream reports (microsoft/WSL#40732, #41224, NVIDIA forum 381943)
# place the host crash. Verified after install: `ollama ps` shows 100% GPU for
# every loaded model, and the load line in the journal says "offloaded N/N".
[Service]
Environment=OLLAMA_GPU_OVERHEAD=1073741824
